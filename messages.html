<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | Paws It On</title><link rel="stylesheet" href="styles.css"><style>.messages-wrap{max-width:1050px;margin:0 auto;padding:70px 6vw}.messages-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}.messages-head h1{margin:.25rem 0;color:#12395B}.messages-summary{font-weight:800;color:#168C8C}.inbox-list{display:grid;gap:14px}.inbox-card{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;background:#fff;border:1px solid #d9e1e3;border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(18,57,91,.06);cursor:pointer}.inbox-card.unread{border:2px solid #168C8C;background:#f5fbfb}.inbox-card img,.inbox-fallback{width:90px;height:90px;object-fit:cover;border-radius:14px;background:#eef3f3;display:grid;place-items:center;font-size:2rem}.inbox-card h3{margin:0 0 6px;color:#12395B}.preview{margin:0;color:#5f6d74;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:620px}.meta-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.role{font-size:.78rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#168C8C}.unread-pill{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:#f4d85c;color:#12395B;font-weight:900;font-size:.78rem}.time{color:#718087;font-size:.85rem;text-align:right}.thread-panel{display:none;margin-top:22px;background:#fff;border:1px solid #d9e1e3;border-radius:20px;padding:20px}.thread-panel.open{display:block}.thread-top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.thread-messages{background:#f7f9f9;border-radius:14px;padding:14px;max-height:480px;overflow:auto}.bubble{max-width:78%;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid #d9e1e3;margin:8px 0}.bubble.mine{margin-left:auto;background:#dceeee}.bubble p{margin:0;white-space:pre-wrap}.reply-box{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.reply-box textarea{width:100%;min-height:60px;padding:12px;border:1px solid #ccd5d8;border-radius:12px;font:inherit;resize:vertical;box-sizing:border-box}.thread-status{grid-column:1/-1;margin:0;font-weight:700;color:#53636b}.empty{padding:24px;background:#fff;border-radius:16px;border:1px solid #d9e1e3}@media(max-width:700px){.messages-wrap{padding:38px 4vw}.inbox-card{grid-template-columns:64px 1fr}.inbox-card img,.inbox-fallback{width:64px;height:64px}.time{grid-column:2;text-align:left}.preview{max-width:240px}.reply-box{grid-template-columns:1fr}.bubble{max-width:90%}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-main">PAWS IT ON</span><span class="brand-tag">Love it. Outgrow it. Paws it on.</span></a><button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button><nav class="nav"><a href="shop.html">Shop Used Gear</a><a href="sell.html">Sell Your Gear</a><a href="messages.html" class="active">Messages</a><a href="account.html">My Paws It On</a></nav></header><main class="messages-wrap"><div class="messages-head"><div><span class="eyebrow dark">INBOX</span><h1>Messages</h1><p>Buyer and seller conversations stay private inside Paws It On.</p></div><div id="messages-summary" class="messages-summary">Checking for new messages…</div></div><div id="inbox-list" class="inbox-list"><p>Loading messages…</p></div><section id="thread-panel" class="thread-panel"><div id="thread-content"></div></section></main><script type="module" src="messages-app.js?v=1"></script><script src="script.js?v=2"></script></body></html>
