<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Paws It On</title><link rel="stylesheet" href="styles.css"><style>[hidden]{display:none!important}.account-wrap{max-width:960px;margin:0 auto;padding:80px 6vw}.account-card{background:#fff;border-radius:24px;padding:32px;box-shadow:0 10px 28px rgba(18,57,91,.12)}.account-card h1,.account-card h2{color:#12395B}.account-grid{display:grid;gap:14px}.account-card label{font-weight:700}.account-card input{width:100%;padding:14px;border:1px solid #ccd5d8;border-radius:10px;font-size:1rem}.account-actions,.listing-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.status{margin-top:14px;font-weight:700}.signed-in{background:#dceeee;padding:18px;border-radius:12px;margin-bottom:18px}.signed-in a{display:inline-block;margin-top:10px;font-weight:800;color:#168C8C;text-decoration:none}.my-listings{margin-top:34px;border-top:2px solid #eef2f2;padding-top:28px}.seller-listing{border:1px solid #d9e1e3;border-radius:16px;padding:20px;margin:14px 0;background:#fff}.seller-listing h3{margin:0 0 6px;color:#12395B}.listing-meta{margin:5px 0;color:#53636b}.listing-state{display:inline-block;margin-bottom:8px;font-weight:900;text-transform:uppercase;font-size:.76rem;letter-spacing:.07em;color:#168C8C}.mini-btn{border:0;border-radius:999px;padding:10px 15px;font-weight:800;cursor:pointer;font-size:.9rem}.mini-btn.edit{background:#dceeee;color:#12395B}.mini-btn.sold{background:#f4d85c;color:#12395B}.mini-btn.remove{background:#12395B;color:#fff}.empty-listings{padding:20px;background:#f5f7f7;border-radius:14px}.account-tools{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}@media(max-width:700px){.account-wrap{padding:40px 4vw}.account-card{padding:22px}.listing-actions .mini-btn{flex:1 1 100%}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-main">PAWS IT ON</span><span class="brand-tag">Love it. Outgrow it. Paws it on.</span></a><button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button><nav class="nav"><a href="shop.html">Shop Used Gear</a><a href="sell.html">Sell Your Gear</a><a class="active" href="account.html">My Paws It On</a></nav></header><main class="account-wrap"><div class="account-card"><span class="eyebrow dark">MY PAWS IT ON</span><h1>Your Paws It On account</h1><p id="account-intro">Checking your account…</p><div id="signed-in-box" class="signed-in" hidden></div><div id="auth-form" class="account-grid" hidden><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6"></label><div class="account-actions"><button id="create-account" class="btn btn-teal" type="button">Create Account</button><button id="sign-in" class="btn btn-yellow" type="button">Sign In</button></div></div><div id="signed-in-tools" class="account-tools" hidden><a class="btn btn-teal" href="sell.html">+ Create a Listing</a><button id="sign-out" class="btn btn-yellow" type="button">Sign Out</button></div><p id="auth-status" class="status"></p><section id="my-listings" class="my-listings" hidden><h2>My Listings</h2><p>Manage the gear you have listed on Paws It On.</p><div id="my-listings-results"><p>Loading your listings…</p></div></section></div></main><script type="module" src="account.js?v=5"></script><script src="script.js"></script></body></html>
